<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <main class="shell">
    <section class="card">
      <div class="brand">
        <div class="logo">L</div>
        <h1>Login</h1>
        <p class="subtitle">Welcome back! Please sign in to continue.</p>
      </div>

      <p id="formMsg" class="form-msg" hidden></p>

      <!-- Signed-in state -->
      <div id="signedInBox" hidden>
        <div class="dash-info">
          <p><span>Signed in as</span><strong id="siName"></strong></p>
          <p><span>Email</span><strong id="siEmail"></strong></p>
        </div>
        <button id="logoutBtn" class="btn-primary">Log Out</button>
      </div>

      <!-- Login form -->
      <form id="loginForm" class="form" novalidate>
        <label class="field">
          <span>Username</span>
          <input id="liUser" type="text" placeholder="Enter your username or email" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Password</span>
          <div class="password-wrap">
            <input id="liPass" type="password" placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" class="eye" data-target="liPass" aria-label="Show password">👁</button>
          </div>
        </label>
        <div class="row-between">
          <label class="remember"><input id="liRemember" type="checkbox" /> Remember me</label>
        </div>
        <button type="submit" class="btn-primary">Login →</button>
        <div class="below-links">
          <a class="link-btn" href="forgot.html">Forgot password?</a>
          <a class="link-btn" href="signup.html">Sign up</a>
        </div>
      </form>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const msg = document.getElementById("formMsg");
    const signedInBox = document.getElementById("signedInBox");

    // If already signed in, show the signed-in state instead of the form.
    const sessionUser = localStorage.getItem(SESSION_KEY);
    if (sessionUser) {
      const user = getUsers().find((u) => u.username === sessionUser);
      if (user) {
        document.getElementById("siName").textContent = user.username;
        document.getElementById("siEmail").textContent = user.email;
        form.hidden = true;
        signedInBox.hidden = false;
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem(SESSION_KEY);
      location.reload();
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const login = document.getElementById("liUser").value.trim();
      const pass = document.getElementById("liPass").value;
      const user = getUsers().find(
        (u) => u.username.toLowerCase() === login.toLowerCase() || u.email === login.toLowerCase()
      );
      if (!user) return showMsg(msg, "No account found with this username or email.", "error");
      if ((await hashPassword(pass)) !== user.passHash) {
        return showMsg(msg, "Incorrect password. Try again or use Forgot password.", "error");
      }
      localStorage.setItem(SESSION_KEY, user.username);
      document.getElementById("siName").textContent = user.username;
      document.getElementById("siEmail").textContent = user.email;
      form.hidden = true;
      signedInBox.hidden = false;
    });
  </script>
</body>
</html>
